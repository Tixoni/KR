name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///./ci_test.db
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Collect tests
        run: |
          echo "=== Collecting unit tests ==="
          pytest --collect-only -q auth-service/test booking-service/test tours-service/test || true

      - name: Run unit tests
        run: |
          echo "=== Running unit tests ==="
          pytest -v auth-service/test booking-service/test tours-service/test
