name: CD Deploy


on:
  push:
    branches:
      - main
      - build
  pull_request:
    branches:
      - main
      - build
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        service: [auth-service, tours-service, booking-service]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Network check (GitHub access)
        run: |
          curl -I -sS https://github.com | head -n 1
          curl -I -sS https://objects.githubusercontent.com | head -n 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Verify Python installation
        run: |
          python --version
          which python || where python

      # Remove cache action to avoid action download failures on self-hosted runner

      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Run unit tests (${{ matrix.service }})
        working-directory: ${{ matrix.service }}
        env:
          PYTHONPATH: .
        run: pytest -q -n auto

        
  frontend-unit-tests:
    needs: [unit-tests]
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt
      - name: Run frontend unit tests
        run: pytest -q -n auto tests/frontend

  frontend-e2e-tests:
    needs: [frontend-unit-tests]
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt
      - name: Run frontend e2e tests (placeholder)
        run: pytest -q -n auto tests/frontend_e2e

  integration-tests:
    needs: [backend-integration-tests]
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Remove cache action to avoid action download failures on self-hosted runner

      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Ensure buildx is available
        run: |
          docker buildx version || true
          docker buildx create --use --name ci-builder 2>/dev/null || docker buildx use ci-builder

      - name: Set up kind
        uses: helm/kind-action@v1.10.0
        with:
          version: v0.24.0
          cluster_name: tourism-ci

      - name: Build Docker images
        shell: bash
        run: |
          retry_pull() {
            local image="$1"; local tries=5; local delay=10
            for i in $(seq 1 "$tries"); do
              echo "Pulling $image (attempt $i/$tries)"
              if docker pull "$image"; then
                return 0
              fi
              echo "Pull failed; sleeping $delay s" && sleep "$delay"
            done
            echo "Failed to pull $image after $tries attempts" >&2
            return 1
          }
          # Warm base images to avoid TLS timeouts during build
          retry_pull python:3.11-slim
          retry_pull nginx:1.25-alpine || true
          docker build -t tourism-platform-auth-service:latest ./auth-service
          docker build -t tourism-platform-tours-service:latest ./tours-service
          docker build -t tourism-platform-booking-service:latest ./booking-service
          docker build -t tourism-platform-frontend:latest ./frontend

      - name: Load images into kind
        run: |
          kind load docker-image tourism-platform-auth-service:latest --name tourism-ci
          kind load docker-image tourism-platform-tours-service:latest --name tourism-ci
          kind load docker-image tourism-platform-booking-service:latest --name tourism-ci
          kind load docker-image tourism-platform-frontend:latest --name tourism-ci

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/secrets.yaml
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/postgres.yaml
          kubectl apply -f k8s/services-backend.yaml
          kubectl apply -f k8s/frontend.yaml

      - name: Wait for pods ready
        run: |
          kubectl -n tourism wait --for=condition=available --timeout=240s deploy/auth-service
          kubectl -n tourism wait --for=condition=available --timeout=240s deploy/tours-service
          kubectl -n tourism wait --for=condition=available --timeout=240s deploy/booking-service
          kubectl -n tourism wait --for=condition=ready pod -l app=postgres --timeout=240s

      - name: Port-forward services
        run: |
          kubectl -n tourism port-forward deploy/auth-service 8000:8000 &
          echo $! > pf-auth.pid
          kubectl -n tourism port-forward deploy/tours-service 8001:8001 &
          echo $! > pf-tours.pid
          kubectl -n tourism port-forward deploy/booking-service 8002:8002 &
          echo $! > pf-booking.pid
          sleep 5

      - name: Run integration tests
        env:
          AUTH_BASE_URL: http://localhost:8000
          TOURS_BASE_URL: http://localhost:8001
          BOOKING_BASE_URL: http://localhost:8002
        run: pytest -q -n auto integration_test.py

      - name: Teardown port-forward
        if: always()
        run: |
          kill $(cat pf-auth.pid) || true
          kill $(cat pf-tours.pid) || true
          kill $(cat pf-booking.pid) || true

  backend-integration-tests:
    needs: [unit-tests]
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt
      - name: Run backend integration tests (placeholder)
        run: pytest -q -n auto tests/backend_integration

  e2e-tests:
    needs: [integration-tests]
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt
      - name: Run e2e tests (placeholder)
        run: pytest -q -n auto tests/e2e

  performance-tests:
    needs: [e2e-tests]
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt
      - name: Run performance tests (placeholder)
        run: pytest -q -n auto tests/performance

  mobile-tests:
    needs: [performance-tests]
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt
      - name: Run mobile tests (placeholder)
        run: pytest -q -n auto tests/mobile

  accessibility-tests:
    needs: [mobile-tests]
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt
      - name: Run accessibility tests (placeholder)
        run: pytest -q -n auto tests/accessibility

  build-and-push:
    needs: [accessibility-tests]
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set repo lowercase (for logs only)
        run: |
          echo "REPO_NAME_LOWER=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set Docker user
        shell: bash
        run: |
          if [[ -z "${{ secrets.DOCKER_USERNAME }}" ]]; then
            echo "DOCKER_USERNAME is required as a secret" >&2
            exit 1
          fi
          echo "DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}" >> $GITHUB_ENV

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & push auth-service
        uses: docker/build-push-action@v5
        with:
          context: ./auth-service
          push: true
          pull: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.DOCKER_USERNAME }}/tourism-platform-auth-service:${{ github.sha }}
            ${{ env.DOCKER_USERNAME }}/tourism-platform-auth-service:latest

      - name: Build & push booking-service
        uses: docker/build-push-action@v5
        with:
          context: ./booking-service
          push: true
          pull: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.DOCKER_USERNAME }}/tourism-platform-booking-service:${{ github.sha }}
            ${{ env.DOCKER_USERNAME }}/tourism-platform-booking-service:latest

      - name: Build & push tours-service
        uses: docker/build-push-action@v5
        with:
          context: ./tours-service
          push: true
          pull: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.DOCKER_USERNAME }}/tourism-platform-tours-service:${{ github.sha }}
            ${{ env.DOCKER_USERNAME }}/tourism-platform-tours-service:latest

      - name: Build & push gateway
        uses: docker/build-push-action@v5
        with:
          context: ./gateway-service
          push: true
          pull: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.DOCKER_USERNAME }}/tourism-platform-gateway:${{ github.sha }}
            ${{ env.DOCKER_USERNAME }}/tourism-platform-gateway:latest

      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          pull: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.DOCKER_USERNAME }}/tourism-platform-frontend:${{ github.sha }}
            ${{ env.DOCKER_USERNAME }}/tourism-platform-frontend:latest

  deploy:
    runs-on: self-hosted
    needs: [build-and-push]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image tag and docker user
        shell: bash
        run: |
          # Prefer explicit secrets; fallback to current commit SHA for deterministic deploys
          if [[ -z "${{ secrets.IMAGE_TAG }}" ]]; then
            echo "IMAGE_TAG=${{ github.sha }}" >> $GITHUB_ENV
          else
            echo "IMAGE_TAG=${{ secrets.IMAGE_TAG }}" >> $GITHUB_ENV
          fi
          if [[ -z "${{ secrets.DOCKER_USERNAME }}" ]]; then
            echo "DOCKER_USERNAME is required as a secret" >&2
            exit 1
          fi
          echo "DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}" >> $GITHUB_ENV

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.30.0'

      - name: Cleanup existing k3d cluster (if exists)
        shell: bash
        run: |
          if k3d cluster list | grep -q "tourism-cluster"; then
            echo "Removing existing cluster tourism-cluster"
            k3d cluster delete tourism-cluster || true
            sleep 2
          fi

      - name: Setup k3d cluster
        uses: AbsaOSS/k3d-action@v2
        with:
          cluster-name: tourism-cluster
          args: >-
            --agents 1
            --api-port 6445
            --wait
      
      - name: Verify cluster context
        run: |
          kubectl config use-context k3d-tourism-cluster
          kubectl get nodes -o wide

      - name: Verify Docker images exist in Docker Hub
        env:
          DOCKER_USERNAME: ${{ env.DOCKER_USERNAME }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
        shell: bash
        run: |
          set -euo pipefail
          images=(
            "tourism-platform-auth-service"
            "tourism-platform-booking-service"
            "tourism-platform-tours-service"
            "tourism-platform-gateway"
            "tourism-platform-frontend"
          )
          for img in "${images[@]}"; do
            echo "Checking $DOCKER_USERNAME/$img:$IMAGE_TAG ..."
            if ! docker manifest inspect "$DOCKER_USERNAME/$img:$IMAGE_TAG" > /dev/null 2>&1; then
              echo "Image not found: $DOCKER_USERNAME/$img:$IMAGE_TAG" >&2
              exit 1
            fi
          done


      - name: Deploy manifests and set images
        env:
          DOCKER_USERNAME: ${{ env.DOCKER_USERNAME }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
        shell: bash
        run: |
          chmod +x k8s/deploy.sh
          ./k8s/deploy.sh


