name: Containers CI/CD

on:
  push:
  pull_request:

jobs:
  containers-up:
    runs-on: ubuntu-latest
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      IMAGE_TAG: ${{ secrets.IMAGE_TAG || 'latest' }}
      SECRET_KEY: ${{ secrets.SECRET_KEY || 'tourism-platform-secret-key-2024-production-ready' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set defaults for pull (public images)
        run: |
          if [ -z "${DOCKER_USERNAME}" ]; then
            echo "DOCKER_USERNAME not set, using public namespace 'tixongomzuak'"
            echo "DOCKER_USERNAME=tixongomzuak" >> $GITHUB_ENV
          else
            echo "DOCKER_USERNAME=${DOCKER_USERNAME}" >> $GITHUB_ENV
          fi

      - name: Set default image tag if empty
        run: |
          if [ -z "${IMAGE_TAG}" ]; then
            echo "IMAGE_TAG=latest" >> $GITHUB_ENV
          else
            echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_ENV
          fi

      - name: Docker info
        run: |
          docker info
          docker compose version

      - name: Pull and start stack (Docker Hub images)
        run: |
          set -euo pipefail
          docker compose -f docker-compose.tests.yml pull
          docker compose -f docker-compose.tests.yml up -d

      - name: Wait for healthchecks
        run: |
          set -euo pipefail
          SERVICES=(
            "auth-service:http://localhost:8000/health"
            "tours-service:http://localhost:8001/health"
            "booking-service:http://localhost:8002/health"
            "gateway:http://localhost:8080/health"
            "frontend:http://localhost/"
          )
          for entry in "${SERVICES[@]}"; do
            name="${entry%%:*}"
            url="${entry#*:}"
            echo "Waiting for $name at $url"
            timeout 300 bash -c '
              for i in {1..60}; do
                if curl -fsS '"${url}"' > /dev/null 2>&1; then
                  echo "'"${name}"' is healthy"
                  exit 0
                fi
                echo "Attempt ${i}: '"${name}"' not ready yet..."
                sleep 5
              done
              echo "Healthcheck failed after 300s for '"${name}"'"
              exit 1
            '
          done

      - name: Logs on failure
        if: failure()
        run: |
          docker compose -f docker-compose.tests.yml ps
          docker compose -f docker-compose.tests.yml logs --tail=200

      - name: Show container status
        run: |
          docker ps
          docker compose -f docker-compose.tests.yml ps

      - name: Check key endpoints
        run: |
          curl -fsS http://localhost:8080/health
          curl -fsS http://localhost:8000/health
          curl -fsS http://localhost:8001/health
          curl -fsS http://localhost:8002/health

      - name: Logs (tail)
        if: always()
        run: |
          docker compose -f docker-compose.tests.yml logs --tail=200

      - name: Tear down
        if: always()
        run: |
          docker compose -f docker-compose.tests.yml down -v

  build-and-push:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/build')
    needs: [containers-up]
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set Docker user
        shell: bash
        run: |
          if [[ -z "${{ secrets.DOCKER_USERNAME }}" ]]; then
            echo "DOCKER_USERNAME is required as a secret" >&2
            exit 1
          fi
          echo "DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}" >> $GITHUB_ENV

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & push auth-service
        uses: docker/build-push-action@v5
        with:
          context: ./auth-service
          push: true
          pull: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.DOCKER_USERNAME }}/tourism-platform-auth-service:${{ github.sha }}
            ${{ env.DOCKER_USERNAME }}/tourism-platform-auth-service:latest

      - name: Build & push booking-service
        uses: docker/build-push-action@v5
        with:
          context: ./booking-service
          push: true
          pull: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.DOCKER_USERNAME }}/tourism-platform-booking-service:${{ github.sha }}
            ${{ env.DOCKER_USERNAME }}/tourism-platform-booking-service:latest

      - name: Build & push tours-service
        uses: docker/build-push-action@v5
        with:
          context: ./tours-service
          push: true
          pull: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.DOCKER_USERNAME }}/tourism-platform-tours-service:${{ github.sha }}
            ${{ env.DOCKER_USERNAME }}/tourism-platform-tours-service:latest

      - name: Build & push gateway
        uses: docker/build-push-action@v5
        with:
          context: ./gateway-service
          push: true
          pull: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.DOCKER_USERNAME }}/tourism-platform-gateway:${{ github.sha }}
            ${{ env.DOCKER_USERNAME }}/tourism-platform-gateway:latest

      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          pull: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.DOCKER_USERNAME }}/tourism-platform-frontend:${{ github.sha }}
            ${{ env.DOCKER_USERNAME }}/tourism-platform-frontend:latest

  deploy:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/build')
    runs-on: self-hosted
    needs: [build-and-push]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image tag and docker user
        shell: bash
        run: |
          if [[ -z "${{ secrets.IMAGE_TAG }}" ]]; then
            echo "IMAGE_TAG=${{ github.sha }}" >> $GITHUB_ENV
          else
            echo "IMAGE_TAG=${{ secrets.IMAGE_TAG }}" >> $GITHUB_ENV
          fi
          if [[ -z "${{ secrets.DOCKER_USERNAME }}" ]]; then
            echo "DOCKER_USERNAME is required as a secret" >&2
            exit 1
          fi
          echo "DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}" >> $GITHUB_ENV

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.30.0'

      - name: Install k3d
        shell: bash
        run: |
          if ! command -v k3d &> /dev/null; then
            curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | bash
          else
            echo "k3d already installed: $(k3d version)"
          fi

      - name: Cleanup existing k3d cluster (if exists)
        shell: bash
        run: |
          k3d cluster delete tourism-cluster 2>/dev/null || true
          sleep 3
          if k3d cluster list 2>/dev/null | grep -q "tourism-cluster"; then
            echo "Warning: Cluster still exists, forcing deletion"
            k3d cluster delete tourism-cluster --all 2>/dev/null || true
            sleep 2
          fi

      - name: Create k3d cluster
        shell: bash
        run: |
          k3d cluster create tourism-cluster \
            --agents 1 \
            --api-port 6445 \
            -p "8080:80@loadbalancer" \
            -p "8081:8080@loadbalancer" \
            --wait \
            --timeout 300s
          k3d cluster list

      - name: Verify cluster context
        run: |
          kubectl config use-context k3d-tourism-cluster
          kubectl get nodes -o wide

      - name: Verify Docker images exist in Docker Hub
        env:
          DOCKER_USERNAME: ${{ env.DOCKER_USERNAME }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
        shell: bash
        run: |
          set -euo pipefail
          images=(
            "tourism-platform-auth-service"
            "tourism-platform-booking-service"
            "tourism-platform-tours-service"
            "tourism-platform-gateway"
            "tourism-platform-frontend"
          )
          for img in "${images[@]}"; do
            echo "Checking $DOCKER_USERNAME/$img:$IMAGE_TAG ..."
            if ! docker manifest inspect "$DOCKER_USERNAME/$img:$IMAGE_TAG" > /dev/null 2>&1; then
              echo "Image not found: $DOCKER_USERNAME/$img:$IMAGE_TAG" >&2
              exit 1
            fi
          done

      - name: Deploy manifests and set images
        env:
          DOCKER_USERNAME: ${{ env.DOCKER_USERNAME }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
        shell: bash
        run: |
          chmod +x k8s/deploy.sh
          ./k8s/deploy.sh

      - name: Wait for deployment to be ready
        run: |
          kubectl -n tourism wait --for=condition=available --timeout=300s deployment/auth-service
          kubectl -n tourism wait --for=condition=available --timeout=300s deployment/tours-service
          kubectl -n tourism wait --for=condition=available --timeout=300s deployment/booking-service
          kubectl -n tourism wait --for=condition=available --timeout=300s deployment/gateway
          kubectl -n tourism wait --for=condition=available --timeout=300s deployment/frontend

      - name: Setup port forwarding for remote access
        shell: bash
        run: |
          kubectl port-forward -n tourism service/frontend 8080:80 > /tmp/pf-frontend.log 2>&1 &
          echo $! > pf-frontend.pid
          kubectl port-forward -n tourism service/gateway 8081:8080 > /tmp/pf-gateway.log 2>&1 &
          echo $! > pf-gateway.pid
          sleep 3
          echo "Port forwarding started (PIDs: $(cat pf-frontend.pid), $(cat pf-gateway.pid))"

      - name: Verify service accessibility
        continue-on-error: true
        run: |
          sleep 5
          if curl -f -s http://localhost:8080/health > /dev/null 2>&1; then
            echo "Frontend accessible via localhost:8080"
          else
            echo "Frontend not accessible via localhost:8080"
          fi
          if curl -f -s http://localhost:8081/health > /dev/null 2>&1; then
            echo "Gateway accessible via localhost:8081"
          else
            echo "Gateway not accessible via localhost:8081"
          fi

      - name: Display access information
        run: |
          echo "Deployment completed successfully!"

      - name: Cleanup port forwarding
        if: always()
        run: |
          if [ -f pf-frontend.pid ]; then
            kill $(cat pf-frontend.pid) 2>/dev/null || true
            rm -f pf-frontend.pid
          fi
          if [ -f pf-gateway.pid ]; then
            kill $(cat pf-gateway.pid) 2>/dev/null || true
            rm -f pf-gateway.pid
          fi
          pkill -f "kubectl port-forward" || true